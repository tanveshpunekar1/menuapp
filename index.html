    <script>
      // Suppress harmless Vite HMR WebSocket errors in environments where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason ? String(event.reason.message || event.reason) : '');
        if (reason.toLowerCase().includes('websocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event && (event.message ? String(event.message) : '');
        if (msg.toLowerCase().includes('websocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-500 selection:text-white">

    <script type="module" src="/src/main.tsx"></script>
  </body>
